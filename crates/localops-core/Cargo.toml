[package]
name = "localops-core"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
dirs = "6"
uuid = { version = "1", features = ["v7"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
